name: Package extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Read extension version
        id: extension
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create Chrome Web Store zip
        shell: bash
        run: |
          package_dir="extension"
          zip_name="chesscom-to-lichess-analysis-${{ steps.extension.outputs.version }}.zip"

          mkdir "$package_dir"
          cp manifest.json "$package_dir/"
          cp -R src "$package_dir/"

          (cd "$package_dir" && zip -r "../$zip_name" .)

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: chesscom-to-lichess-analysis-${{ steps.extension.outputs.version }}
          path: chesscom-to-lichess-analysis-${{ steps.extension.outputs.version }}.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.extension.outputs.version }}
          ZIP_NAME: chesscom-to-lichess-analysis-${{ steps.extension.outputs.version }}.zip
        run: |
          gh release create "$RELEASE_TAG" "$ZIP_NAME" \
            --verify-tag \
            --title "Chess.com to Lichess $RELEASE_VERSION" \
            --generate-notes
